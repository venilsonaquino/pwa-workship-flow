name: CD - Deploy to Production

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    container: docker.io/catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Checking
        run: npm run type-check

      - name: Build Application
        run: npm run build

  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    container: docker.io/catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Format API Base URL
        id: format-api
        run: |
          API_URL="${{ vars.VITE_API_BASE_URL }}"
          if [[ ! "$API_URL" =~ /api$ ]]; then
            API_URL="${API_URL%/}/api"
          fi
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          target: final
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/worshipflow-pwa:prod
            ${{ secrets.DOCKER_USERNAME }}/worshipflow-pwa:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ steps.format-api.outputs.API_URL }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: docker
    runs-on: ubuntu-latest
    container: docker.io/catthehacker/ubuntu:act-latest

    steps:
      - name: SSH Deploy Command
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "Criando diretório da stack..."
            mkdir -p ~/worshipflow-pwa
            cd ~/worshipflow-pwa

            echo "Escrevendo docker-compose.yml..."
            cat << 'EOF' > docker-compose.yml
            version: "3.8"

            services:
              worshipflow-pwa:
                image: ${{ secrets.DOCKER_USERNAME }}/worshipflow-pwa:prod
                container_name: worshipflow-pwa
                ports:
                  - "80:80"
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/index.html"]
                  interval: 30s
                  timeout: 5s
                  retries: 3
                  start_period: 20s
            EOF

            echo "Removendo container avulso antigo (se houver)..."
            docker stop worshipflow-pwa || true
            docker rm worshipflow-pwa || true

            echo "Efetuando pull da imagem da Stack..."
            docker compose -p worshipflow pull

            echo "Iniciando/Atualizando a Stack..."
            docker compose -p worshipflow up -d

            echo "Limpeza de imagens órfãs..."
            docker image prune -f

            echo "Deploy concluído com sucesso!"
