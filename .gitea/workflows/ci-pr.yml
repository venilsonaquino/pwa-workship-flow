name: CI - Pull Request

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Build, Lint & SonarQube
    runs-on: ubuntu-latest
    container: docker.io/catthehacker/ubuntu:act-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o SonarQube analisar o histórico completo

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Checking
        run: npm run type-check

      - name: Build Application
        run: npm run build

      - name: Run SonarQube Analysis
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey="worshipflow-pwa" \
            -Dsonar.projectName="WorshipFlow PWA" \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}" \
            -Dsonar.token="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.sources="src" \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts"
